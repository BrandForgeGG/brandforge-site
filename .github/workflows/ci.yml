name: CI

# Phase 0 foundation: every push must pass lint + typecheck + tests + build.
# The build runs with placeholder Supabase values on purpose: NEXT_PUBLIC_* are inlined at build
# time and the app already falls back to placeholders, so CI needs no production secrets.

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: brandforge-site

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: brandforge-site/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: node --test "lib/*.test.js"

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://brandforge.gg
